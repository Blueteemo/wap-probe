name: One-shot public WAP Labs anonymous WSP GET
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wsp-lab-once.yml']
permissions:
  contents: read
jobs:
  first-party-public-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: One explicitly allowlisted WSP/WDP GET, no cookies or follow-ups
        shell: bash
        run: |
          set +e
          python -m wap_probe.wsp_readonly --lab --allow-network --execute
          result=$?
          echo "WSP_LAB_SINGLE_GET_EXIT=$result"
          exit 0
