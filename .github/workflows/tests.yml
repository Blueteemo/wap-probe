name: Offline Python Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R5_PROBE_DIR: .r5_unpacked/wap-probe-live-discovery-r5/probe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify immutable R5 and unpack
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          archive = pathlib.Path("vendor/r5/WAP_Probe_WAP_Labs_Interop_R5_20261028.zip")
          expected = "cb98d2cc060cfe775a8adf99162160c7651c306a534f3770bbb7c356034b31fa"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Frozen R5 SHA-256 mismatch: {actual}")
          destination = pathlib.Path(".r5_unpacked")
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  item = pathlib.PurePosixPath(entry.filename)
                  if item.is_absolute() or ".." in item.parts or "\\" in entry.filename:
                      raise SystemExit("Unsafe R5 archive path")
              z.extractall(destination)
          print("Frozen R5 archive SHA-256 verified and extracted")
          PY
      - name: Compile current Python sources
        run: python -m compileall -q src tests
      - name: Run R6 and real R5 adapter tests
        run: python -m unittest discover -s tests -v
      - name: Run frozen R5 original tests
        run: |
          set -eu
          for component in probe discovery integrations; do
            echo "===== R5 $component ====="
            (cd ".r5_unpacked/wap-probe-live-discovery-r5/$component" \
              && python -m unittest discover -p 'test_*.py' -q)
          done

  clean-install:
    name: Clean editable install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create ordinary-user virtualenv and install entrypoints
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install -e .
      - name: Test installed CLI and MCP with synthetic offline WML/WMLC evidence
        run: |
          export PATH="$PWD/.smoke-venv/bin:$PATH"
          unset PYTHONPATH
          .smoke-venv/bin/python scripts/smoke_clean_install.py

  source-archive-smoke:
    name: Source archive install (Python 3.12)
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build ordinary Git source archive and verify installed commands
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/wap-probe-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/wap-probe-source"
          cd "$RUNNER_TEMP/wap-probe-source"
          python -m venv .release-venv
          .release-venv/bin/python -m pip install -e .
          export PATH="$PWD/.release-venv/bin:$PATH"
          unset PYTHONPATH
          .release-venv/bin/python scripts/smoke_clean_install.py

      - name: Install private clean-source fallback and check real CLI/MCP
        run: |
          set -eu
          python scripts/build_clean_source_candidate.py --out "$RUNNER_TEMP/wap-probe-clean-candidate"
          cd "$RUNNER_TEMP/wap-probe-clean-candidate"
          python -m venv .candidate-venv
          .candidate-venv/bin/python -m pip install -e .
          export PATH="$PWD/.candidate-venv/bin:$PATH"
          unset PYTHONPATH
          .candidate-venv/bin/python scripts/smoke_clean_install.py
          .candidate-venv/bin/python -m unittest discover -s tests -v

  macos-clean-install:
    name: macOS clean editable install (Python 3.12)
    runs-on: macos-15
    needs: offline
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and verify rootless CLI/MCP on a clean macOS runner
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install -e .
          export PATH="$PWD/.smoke-venv/bin:$PATH"
          unset PYTHONPATH
          .smoke-venv/bin/python scripts/smoke_clean_install.py

  publication-audit:
    name: Historical source and public-readiness triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inventory licenses, frozen R5 archive and historical secret indicators
        run: python scripts/audit_publication.py
