name: One-shot calligraphy WMLC preference diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmlc-negotiation-once.yml
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: One direct anonymous GET, redact all response contents
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from wap_probe.agent_browser import open_page
          with tempfile.TemporaryDirectory(prefix="calligraphy-wmlc-") as t:
              try:
                  view=open_page("http://wap.shufaji.com/",Path(t)/"one",profile="wmlc")
                  import json
                  meta=json.loads((Path(t)/"one/pages/page-0001/metadata.json").read_text())
                  print("CALLIGRAPHY_WMLC_RECHECK",
                        "curl_exit="+str(meta.get("curl_exit_code")),
                        "http="+str(view.get("http_status")),
                        "mime="+str(view.get("mime")),
                        "classification="+str(view.get("capture_status")),
                        "parser_ok="+str(view.get("ok")),
                        "format="+str(view.get("format","none")),
                        "bytes="+str(view.get("bytes")),flush=True)
              except Exception as exc:
                  print("CALLIGRAPHY_WMLC_RECHECK error="+type(exc).__name__,flush=True)
          PY
