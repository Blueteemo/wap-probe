name: One-shot Blue G WML navigation classification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-live-compat-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: One public GET; inspect XML/R5 navigation metadata only
        shell: bash
        run: |
          python - <<'PY'
          import tempfile,json,re,xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit
          from wap_probe.agent_browser import open_page
          with tempfile.TemporaryDirectory(prefix="blueg-one-shot-") as t:
              root=Path(t)/"session"
              result=open_page("http://wap.yuyangzhou.name/",root,"wap1")
              assert result["ok"] and result["mime"]=="text/vnd.wap.wml"
              folder=root/"pages"/"page-0001"
              metadata=json.loads((folder/"metadata.json").read_text())
              xml=(folder/"body.bin").read_bytes()
              encoding=re.search(rb'encoding\s*=\s*["\x27]([\w-]+)',xml[:200])
              codec=encoding.group(1).decode("ascii") if encoding else "utf-8"
              deck=ET.fromstring(xml.decode(codec))
              record=json.loads((folder/"r5_export.json").read_text())
              tags={}
              for item in deck.iter():
                  tag=item.tag.rsplit("}",1)[-1].lower()
                  tags[tag]=tags.get(tag,0)+1
                  if tag in ("a","anchor","go","do"):
                      href=item.attrib.get("href","")
                      parsed=urlsplit(href)
                      path=parsed.path
                      if path and re.fullmatch(r"/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*",path):
                          location=path
                      else:
                          location="[other/none]"
                      print(f"BLUEG_NODE tag={tag} path={location} method={item.get('method','default')} postfields={len([x for x in item.iter() if x.tag.endswith('postfield')])}")
              print(f"BLUEG_TAG_COUNTS {json.dumps(tags,sort_keys=True)}")
              print(f"BLUEG_AGENT cards={result['card_count']} links={len(result['links'])} cards_links={len(result['card_links'])}")
              for card in record["cards"]:
                  print(f"BLUEG_R5 card_links={len(card.get('links',[]))}")
                  for link in card.get("links",[])[:25]:
                      p=urlsplit(link.get("href","")).path
                      if p and re.fullmatch(r"/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*",p):
                          print(f"BLUEG_R5_LINK path={p} method={link.get('method')}")
          PY
