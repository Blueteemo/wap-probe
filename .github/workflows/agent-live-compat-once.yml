name: One-shot Blue G Agent no-input WML navigation acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-live-compat-once.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify actual public do/go path and child WML
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from urllib.parse import urlsplit
          from wap_probe.agent_browser import open_page, follow_do, read_page
          with tempfile.TemporaryDirectory(prefix="blueg-go-live-") as temp:
              session = Path(temp) / "visit"
              first = open_page("http://wap.yuyangzhou.name/", session, "wap1")
              if not first.get("ok") or first.get("http_status") != 200:
                  raise SystemExit("Blue G home not parsed as original HTTP WML")
              matches = [x["index"] for x in first["do_links"]
                         if urlsplit(x["url"]).path == "/m_service/default.wml"]
              print("BLUEG_AGENT_HOME_OK status=200 cards=",first["card_count"],
                    "ordinary_links=",len(first["links"]),
                    "explicit_do_links=",len(first["do_links"]),
                    "text_chars=",len(first["text"]),
                    "sha=",first["sha256"],flush=True)
              if not matches:
                  raise SystemExit("No safe explicit do/go mobile service link")
              second = follow_do(session, matches[0])
              if not second.get("ok") or second.get("http_status") != 200:
                  raise SystemExit("Agent explicit do/go did not return child WML")
              if second.get("format") != "wml" or not second.get("text"):
                  raise SystemExit("Expected readable WML child text")
              back = __import__("wap_probe.agent_browser", fromlist=["go_back"]).go_back(session)
              if back["cursor"] != 0:
                  raise SystemExit("Back history did not restore original deck")
              print("BLUEG_AGENT_DO_CHILD_OK status=200 cards=",second["card_count"],
                    "ordinary_links=",len(second["links"]),
                    "explicit_do_links=",len(second["do_links"]),
                    "text_chars=",len(second["text"]),
                    "sha=",second["sha256"],flush=True)
              print("BLUEG_EXPLICIT_NAVIGATION_PASS", flush=True)
          PY
