name: R8 final bounded Chinese WML candidate screening

# Single push trigger on creating or changing this exact unique file.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r8-final-candidates-one-shot-20261029.yml'

permissions:
  contents: read

concurrency:
  group: wap-origin-one-at-a-time
  cancel-in-progress: false

jobs:
  finish-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and safely unpack exact frozen R5
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path,PurePosixPath
          archive=Path('vendor/r5/WAP_Probe_WAP_Labs_Interop_R5_20261028.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != 'cb98d2cc060cfe775a8adf99162160c7651c306a534f3770bbb7c356034b31fa':
              raise SystemExit('R5 checksum mismatch')
          with zipfile.ZipFile(archive) as z:
              for e in z.infolist():
                  p=PurePosixPath(e.filename)
                  if p.is_absolute() or '..' in p.parts or chr(92) in e.filename:
                      raise SystemExit('R5 archive path invalid')
              z.extractall('.r5_unpacked')
          PY
      - name: Five named public GET-only attempts; at most ten GETs total
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # No login, cookie, redirects, proxies, form/POST or user-supplied target.
          # Every optional child link is parsed from actual homepage bytes.
          function check {
            local label="$1" url="$2" profile="$3"
            echo "::group::$label"
            if ! python -m wap_probe.pipeline \
                --url "$url" --profile "$profile" \
                --r5-dir .r5_unpacked/wap-probe-live-discovery-r5/probe \
                --out "evidence/$label" --limit 1 --delay 2 --execute; then
              echo "COLLECTOR_COMMAND_FAILED: $label"
            fi
            echo "::endgroup::"
            sleep 3
          }
          check 'blueglab' 'http://wap.yuyangzhou.name/' 'wap1'
          check 'ee1234' 'http://wap.ee1234.com/' 'wap1'
          check 'uc123' 'http://wap.uc123.com/' 'wap1'
          check 'cctv-wml' 'http://www.cctv.com/wap/index.wml' 'wap1'
          check '517ming-s60' 'http://wap.517ming.com/' 's60'
      - name: Emit non-sensitive summary from captured metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names=['blueglab','ee1234','uc123','cctv-wml','517ming-s60']
          result=[]
          for name in names:
              matches=list((Path('evidence')/name).glob('001_*/run_report.json'))
              if not matches:
                  result.append(dict(target=name,stage='NO_REPORT'))
                  continue
              report=json.loads(matches[0].read_text())
              def stage_meta(part):
                  p=matches[0].parent/part/'metadata.json'
                  if not p.exists():
                      return None
                  data=json.loads(p.read_text())
                  return {k:data.get(k) for k in ('classification','http_status','body_size','content_type') if k in data}
              result.append(dict(target=name,stage=report.get('stage'),
                 home=report.get('home_capture'),child=report.get('child_capture'),
                 A_origin=report.get('A_origin'),A_navigation=report.get('A_navigation'),
                 home_meta=stage_meta('home'),child_meta=stage_meta('child')))
          Path('evidence/public-summary.json').write_text(
             json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Keep raw evidence only as private short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-candidate-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
