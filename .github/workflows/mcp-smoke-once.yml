name: One-shot local MCP to public WML acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify MCP JSON-RPC opens and follows two public WML pages
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          server=subprocess.Popen(
              [sys.executable,'-m','wap_probe.agent_mcp','--allow-network'],
              stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
              text=True,bufsize=1,env=os.environ.copy())
          try:
              def rpc(id_,method,params=None):
                  request={'jsonrpc':'2.0','id':id_,'method':method}
                  if params is not None:request['params']=params
                  server.stdin.write(json.dumps(request)+'\n')
                  server.stdin.flush()
                  line=server.stdout.readline()
                  if not line:raise SystemExit('No MCP response')
                  response=json.loads(line)
                  if response.get('id')!=id_:raise SystemExit('Unexpected MCP response id')
                  if 'error' in response:raise SystemExit('MCP JSON-RPC error')
                  return response['result']
              init=rpc(1,'initialize',{'protocolVersion':'2025-11-25',
                                      'clientInfo':{'name':'CI','version':'1.0'}})
              assert init['protocolVersion']=='2025-11-25'
              server.stdin.write(json.dumps({'jsonrpc':'2.0',
                                        'method':'notifications/initialized'})+'\n')
              server.stdin.flush()
              discovered=rpc(2,'tools/list')
              assert len(discovered['tools'])==4
              first=rpc(3,'tools/call',{'name':'wap_open','arguments':{
                  'url':'http://wap.shufaji.com/','execute':True,'profile':'wap1'}})
              page=first['structuredContent']
              if not page.get('ok') or page.get('http_status')!=200 or not page.get('text'):
                  raise SystemExit('MCP open failed to read public WML')
              ids=[link['index'] for link in page['links']
                   if link['url'].endswith('/0x541B.wml')]
              if not ids:raise SystemExit('Expected detail link missing')
              sid=page['session_id']
              child=rpc(4,'tools/call',{'name':'wap_follow','arguments':{
                  'session_id':sid,'link':ids[0],'execute':True}})['structuredContent']
              if not child.get('ok') or child.get('http_status')!=200 or not child.get('text'):
                  raise SystemExit('MCP follow failed to read WML detail')
              back=rpc(5,'tools/call',{'name':'wap_back',
                    'arguments':{'session_id':sid}})['structuredContent']
              if back['cursor']!=0:raise SystemExit('MCP back did not restore home')
              print('MCP_LIVE_PASS: 2025-11-25 initialize, tools/list,')
              print('  open 200, follow 200, offline back success')
              print('  home text chars=',len(page['text']),
                    'child text chars=',len(child['text']))
          finally:
              server.stdin.close()
              server.wait(timeout=10)
          PY
