name: R7 independent WaveNav replay of retained WML (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7-wavenav-one-shot-20261029.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private WAP Probe
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout independent WAP Labs at immutable revision
        uses: actions/checkout@v5
        with:
          repository: dills122/wap-labs
          ref: 9cd7ab97dc6752fc1616feb3505a58603f6a45df
          path: external/wap-labs
          persist-credentials: false
      - name: Retrieve original private R6 evidence (no new site requests)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40846429748 --repo "$GITHUB_REPOSITORY" --name r6-sections-20261029-40846429748 --dir .r7-input/first
          gh run download 40846746719 --repo "$GITHUB_REPOSITORY" --name r6-sections-20261029-40846746719 --dir .r7-input/second
      - name: Verify original byte hashes; do not publish headers or body
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          samples = [
            ('shufaji-nokia-home', '.r7-input/first/shufaji-legacy/001_wap1/home/body.bin', '494f2c10e76e0ad8627553ca857a623604d416fd1a192fda51c63ef103dcf6da'),
            ('shufaji-nokia-child', '.r7-input/first/shufaji-legacy/001_wap1/child/body.bin', 'f2847963831362437a726d7d08a12dec5bad2b9800c96892f307388a13c1480a'),
            ('shufaji-s60-home', '.r7-input/second/shufaji-s60/001_s60/home/body.bin', '92dce101db1176c35633dc82a88f38db9665a7debd7831ceabbafa97711e446d'),
            ('shufaji-s60-child', '.r7-input/second/shufaji-s60/001_s60/child/body.bin', 'f890118195b07957f9c39bca5101840126133e09833f92ad3750e8fee014b125'),
            ('517ming-nokia-home', '.r7-input/second/ming-legacy/001_wap1/home/body.bin', 'd791f81069570aaac5acb5fd72724910ed9781184d4a73c7aea0c1dda94551b3'),
            ('517ming-nokia-child', '.r7-input/second/ming-legacy/001_wap1/child/body.bin', '9bc174b9f5c207376a887935a860b1a72617bc6b2284fbd9c58f8789ce045958'),
          ]
          for name, pathname, want in samples:
              raw = Path(pathname).read_bytes()
              got = hashlib.sha256(raw).hexdigest()
              if got != want:
                  raise SystemExit(f'Original evidence mismatch for {name}: {got}')
              print(f'VERIFIED {name}: {len(raw)} bytes, sha256={got}')
          PY
      - name: Build fixed independent native WaveNav parser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r7-wavenav/src
          cat > .r7-wavenav/Cargo.toml <<'TOML'
          [package]
          name = "wap_r7_wavenav_replay"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          wavenav_engine = { path = "../external/wap-labs/engine-wasm/engine", default-features = false }
          TOML
          cat > .r7-wavenav/src/main.rs <<'RS'
          use std::{env, fs};
          use wavenav_engine::WmlEngine;

          fn check(path: &str, url: &str) -> Result<String, String> {
              let raw = fs::read(path).map_err(|e| format!("read: {e}"))?;
              let xml = String::from_utf8(raw).map_err(|e| format!("UTF8: {e}"))?;
              let mut engine = WmlEngine::new();
              engine
                  .load_deck_context(&xml, url, "text/vnd.wap.wml", None)
                  .map_err(|e| format!("load_deck: {e}"))?;
              let card = engine.active_card_id().map_err(|e| format!("active_card: {e}"))?;
              let frame = engine.render_frame().map_err(|e| format!("render_frame: {e:?}"))?;
              Ok(format!("card-id-length={} frame-rows={} content-rows={}",
                         card.chars().count(), frame.rows.len(), frame.viewport.content_rows))
          }

          fn main() {
              let args: Vec<String> = env::args().skip(1).collect();
              if args.len() % 3 != 0 || args.is_empty() {
                  eprintln!("Expected repeated name path url triples");
                  std::process::exit(2);
              }
              for triplet in args.chunks_exact(3) {
                  let name = &triplet[0];
                  let message = match check(&triplet[1], &triplet[2]) {
                      Ok(value) => format!("PASS\t{value}"),
                      Err(e) => format!("FAIL\t{}", e.replace(['\n', '\r', '\t'], " ")),
                  };
                  println!("RESULT\t{name}\t{message}");
              }
          }
          RS
          cargo build --manifest-path .r7-wavenav/Cargo.toml --release
      - name: Independently load and render six unchanged original WML files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-results
          .r7-wavenav/target/release/wap_r7_wavenav_replay \
            shufaji-nokia-home .r7-input/first/shufaji-legacy/001_wap1/home/body.bin http://wap.shufaji.com/ \
            shufaji-nokia-child .r7-input/first/shufaji-legacy/001_wap1/child/body.bin http://wap.shufaji.com/0x541B.wml \
            shufaji-s60-home .r7-input/second/shufaji-s60/001_s60/home/body.bin http://wap.shufaji.com/ \
            shufaji-s60-child .r7-input/second/shufaji-s60/001_s60/child/body.bin http://wap.shufaji.com/0x541B.wml \
            517ming-nokia-home .r7-input/second/ming-legacy/001_wap1/home/body.bin http://wap.517ming.com/ \
            517ming-nokia-child .r7-input/second/ming-legacy/001_wap1/child/body.bin http://wap.517ming.com/helian-xing.wml \
            | tee r7-results/wavenav-results.txt
      - name: Upload only non-sensitive independent-engine outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-wavenav-results-${{ github.run_id }}
          path: r7-results/
          if-no-files-found: warn
          retention-days: 7
