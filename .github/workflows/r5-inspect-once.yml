name: Internal R5 WMLC API inspection (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r5-inspect-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Introspect retained R5 decoder on synthetic fixture (no network)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib,zipfile,inspect,json,sys
          from pathlib import Path,PurePosixPath
          archive=Path('vendor/r5/WAP_Probe_WAP_Labs_Interop_R5_20261028.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='cb98d2cc060cfe775a8adf99162160c7651c306a534f3770bbb7c356034b31fa'
          with zipfile.ZipFile(archive) as z:
              for i in z.infolist():
                  p=PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in i.filename
              print('LICENSE_CANDIDATES', [x for x in z.namelist() if any(p in x.lower() for p in ['license','copying','readme'])][:18])
              z.extractall('.r5_unpacked')
          from wap_probe.r5_adapter import _legacy_parser
          root=Path('.r5_unpacked/wap-probe-live-discovery-r5/probe')
          core=_legacy_parser(root)
          wb=sys.modules.get('wap_wbxml')
          print('CORE_FUNCTIONS', sorted(x for x in dir(core) if any(y in x.lower() for y in ['wml','wbxml','markup','decode','parse'])) )
          import importlib.util
          p=importlib.util.spec_from_file_location('r5wb',root/'wap_wbxml.py')
          m=importlib.util.module_from_spec(p);p.loader.exec_module(m)
          print('WB_FUNCTIONS',[(x,str(inspect.signature(getattr(m,x)))) for x in dir(m) if not x.startswith('_') and (inspect.isfunction(getattr(m,x)) or inspect.isclass(getattr(m,x)))][:40])
          fixture=(root/'fixtures/binary_portal.wmlc').read_bytes()
          result=core.inspect_markup(fixture,'application/vnd.wap.wmlc')
          print('ANALYSIS_KEYS',sorted(result.keys()))
          for k,v in result.items():
              if isinstance(v,(str,int,float,bool,type(None))):print('SCALAR',k,repr(v)[:400])
              elif isinstance(v,list):print('LIST',k,len(v),'first',repr(v[0])[:1300] if v else '')
              elif isinstance(v,dict):print('DICT',k,list(v.keys())[:30])
          for name in ['parse_wbxml','decode_wbxml','decode_wmlc','parse_wmlc']:
              if hasattr(m,name):
                  func=getattr(m,name)
                  print('DECODER_FUNCTION',name,inspect.getsource(func)[:5500])
          PY
