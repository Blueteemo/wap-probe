name: R6 TX anonymous WML one-shot (2026-10-29)

# Exactly one auto-triggered push for this unique workflow path.
# No schedule, login, POST, redirect following, or repeat scan.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tx-anon-one-shot-20261029.yml']

permissions:
  contents: read

concurrency:
  group: wap-origin-one-at-a-time
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact frozen R5 before unpacking
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path, PurePosixPath
          p = Path('vendor/r5/WAP_Probe_WAP_Labs_Interop_R5_20261028.zip')
          expected = 'cb98d2cc060cfe775a8adf99162160c7651c306a534f3770bbb7c356034b31fa'
          if hashlib.sha256(p.read_bytes()).hexdigest() != expected:
              raise SystemExit('Frozen R5 checksum mismatch')
          with zipfile.ZipFile(p) as z:
              for member in z.infolist():
                  part = PurePosixPath(member.filename)
                  if part.is_absolute() or '..' in part.parts or chr(92) in member.filename:
                      raise SystemExit('Unsafe archive path')
              z.extractall('.r5_unpacked')
          PY
      - name: Capture only HTTPS WML home and one matched anonymous categories link
        shell: bash
        run: |
          set -euo pipefail
          python -m wap_probe.pipeline \
            --url https://tx.com.cn/ \
            --profile wap1 \
            --prefer-path /zone/cs/category.do \
            --anonymous-jsessionid \
            --r5-dir .r5_unpacked/wap-probe-live-discovery-r5/probe \
            --out evidence/tx-anon \
            --limit 1 \
            --delay 2 \
            --execute
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('evidence/tx-anon/001_wap1')
          report = json.loads((root / 'run_report.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'stage': report.get('stage'),
              'A_origin': report.get('A_origin'),
              'A_navigation': report.get('A_navigation'),
              'home_capture': report.get('home_capture'),
              'child_capture': report.get('child_capture'),
              'anonymous_session_mode': report.get('anonymous_session_mode'),
          }, ensure_ascii=False))
          PY
      - name: Keep temporary private evidence (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-anon-one-shot-20261029
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
