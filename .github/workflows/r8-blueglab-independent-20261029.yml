name: R8 Blue G Lab GB2312 WML independent offline replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r8-blueglab-independent-20261029.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: dills122/wap-labs
          ref: 9cd7ab97dc6752fc1616feb3505a58603f6a45df
          path: external/wap-labs
          persist-credentials: false
      - name: Retrieve private original evidence; no site GET
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40848675568 --repo "$GITHUB_REPOSITORY" \
            --name r8-blueglab-40848675568 --dir .blue-input
      - name: Hash-check original GB2312 bytes and derive Unicode WML text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          samples={
             'blue-home':('service/001_wap1/home/body.bin','97deed8c5332a314e8cb163ce61ff5a6576358427c015f6180f4e8a8bd227a6a'),
             'blue-service':('service/001_wap1/child/body.bin','93342fd63493503b096a470671a7e8bd6f4fc7ddee3961136083c5022335c11d'),
             'blue-downloads':('downloads/001_wap1/child/body.bin','14b631d4ff22792183c375b0f001e49e52c418bf4036b09808a4971dcaaeeea3'),
          }
          out=Path('.blue-normalized');out.mkdir(exist_ok=True)
          for name,(path,want) in samples.items():
              raw=(Path('.blue-input')/path).read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              if got!=want:raise SystemExit(f'FAIL raw SHA: {name}')
              decoded=raw.decode('gb2312',errors='strict')
              # Only transcode XML bytes into UTF-8 text; no element/content edits.
              normalized=decoded.encode('utf-8')
              (out/(name+'.xml')).write_bytes(normalized)
              print(f'ORIGINAL_VERIFIED {name} {len(raw)} bytes {got}; decoded=gb2312')
          PY
      - name: Compile independent pinned WaveNav native WML engine
        shell: bash
        run: |
          mkdir -p .blue-engine/src
          cat > .blue-engine/Cargo.toml <<'TOML'
          [package]
          name = "blue_wml_replay"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          wavenav_engine = { path = "../external/wap-labs/engine-wasm/engine", default-features = false }
          TOML
          cat > .blue-engine/src/main.rs <<'RS'
          use std::{env,fs};
          use wavenav_engine::WmlEngine;
          fn main(){
              let args:Vec<String>=env::args().skip(1).collect();
              if args.len()%3!=0 || args.is_empty(){std::process::exit(2)}
              for v in args.chunks_exact(3){
                  let txt=fs::read_to_string(&v[1]).expect("UTF-8 Unicode WML");
                  let mut e=WmlEngine::new();
                  if let Err(s)=e.load_deck_context(&txt,&v[2],"text/vnd.wap.wml",None){
                      eprintln!("FAIL {} load: {}",v[0],s);std::process::exit(1)
                  }
                  let frame=e.render_frame().expect("render frame");
                  if frame.rows.is_empty(){eprintln!("FAIL {} empty",v[0]);std::process::exit(1)}
                  println!("PASS {} frame-rows={} content-rows={}",v[0],frame.rows.len(),frame.viewport.content_rows);
              }
          }
          RS
          cargo build --manifest-path .blue-engine/Cargo.toml --release
      - name: Load and render three decoded independent WML decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p blue-safe-output
          .blue-engine/target/release/blue_wml_replay \
            blue-home .blue-normalized/blue-home.xml http://wap.yuyangzhou.name/ \
            blue-service .blue-normalized/blue-service.xml http://wap.yuyangzhou.name/m_service/default.wml \
            blue-downloads .blue-normalized/blue-downloads.xml http://wap.yuyangzhou.name/download/default.wml \
            | tee blue-safe-output/results.txt
      - name: Upload safe result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-independent-${{ github.run_id }}
          path: blue-safe-output/
          if-no-files-found: warn
          retention-days: 7
