[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wap-probe"
version = "0.2.0"
description = "Rootless Agent-facing HTTP WML reader and reproducible WAP research tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wap-agent = "wap_probe.agent_browser:main"

[tool.setuptools.packages.find]
where = ["src"]
